name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests (Ubuntu)
    runs-on: ubuntu-latest
    environment: pr-build-approval

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  large-batch-smoke:
    name: Large-batch smoke checks (Ubuntu)
    runs-on: ubuntu-latest
    environment: pr-build-approval
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run large-batch smoke tests
        run: |
          python -m unittest -v \
            tests.test_generate_textures.GenerateTexturesTests.test_compute_preview_refresh_delay_ms_throttles_for_huge_batches \
            tests.test_generate_textures.GenerateTexturesTests.test_compute_deferred_preview_tile_interval_ms_increases_for_huge_batches \
            tests.test_generate_textures.GenerateTexturesTests.test_should_update_live_batch_preview_throttles_dense_updates_for_huge_batches \
            tests.test_generate_textures.GenerateTexturesTests.test_build_batch_bottleneck_hints_includes_large_run_resume_guidance \
            tests.test_generate_textures.GenerateTexturesTests.test_run_batch_with_options_writes_checkpoint_file \
            tests.test_generate_textures.GenerateTexturesTests.test_run_batch_with_options_resume_checkpoint_skips_completed_successes \
            tests.test_generate_textures.GenerateTexturesTests.test_gui_processing_queue_smoke_done_event_reports_outputs_failures_and_autopatch

  release-readiness:
    name: Release validation gate artifacts (Ubuntu)
    runs-on: ubuntu-latest
    environment: pr-build-approval
    needs:
      - test
      - large-batch-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download prior release-readiness artifacts (history seed)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          branch: ${{ github.event.repository.default_branch }}
          name: release-readiness-artifacts
          path: artifacts/previous_release_readiness
          if_no_artifact_found: warn

      - name: Pre-release validation gate + artifact generation
        run: |
          python scripts/pre_release_validation.py \
            --repeat-validation-loops 4 \
            --packaged-smoke-loops 3 \
            --strict-localization-completeness \
            --artifact-dir artifacts/release_readiness \
            --history-file artifacts/release_readiness/nif_family_trend_history.json \
            --seed-history-file artifacts/previous_release_readiness/nif_family_trend_history.json \
            --seed-realmod-delta-file artifacts/previous_release_readiness/nif_realmod_parity_delta_report.json

      - name: Upload release-readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-artifacts
          path: artifacts/release_readiness
          if-no-files-found: error

  build-exe:
    name: Build Windows exe & upload zip
    runs-on: windows-latest
    environment: pr-build-approval
    needs:
      - test
      - large-batch-smoke
      - release-readiness

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate application icon
        run: python assets/create_panda_ico.py

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --collect-all numpy --add-data "nif_patcher.py;." --name generate_textures --icon assets\panda.ico generate_textures.py

      - name: Smoke run packaged executable
        run: .\dist\generate_textures.exe --help

      - name: End-to-end packaged executable smoke generation
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import subprocess
          from scripts.pre_release_validation import _packaged_smoke_scenarios

          smoke_root = Path("artifacts") / "packaged_smoke"
          smoke_root.mkdir(parents=True, exist_ok=True)
          input_png = smoke_root / "sample_input.png"
          input_png.write_bytes(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVR4nGP8z8Dwn4GBgYGJAQoAHxcCAr7cGDwAAAAASUVORK5CYII="))
          binary = str(Path("dist") / "generate_textures.exe")
          scenarios = _packaged_smoke_scenarios()
          for loop_index in range(1, 4):
              for scenario in scenarios:
                  scenario_name = str(scenario.get("name", "scenario")).strip() or "scenario"
                  scenario_args = [str(arg) for arg in (scenario.get("args", []) or [])]
                  min_outputs = max(1, int(scenario.get("min_outputs", 1) or 1))
                  required_suffixes = tuple(
                      str(suffix).strip().lower()
                      for suffix in (scenario.get("required_suffixes", ()) or ())
                      if str(suffix).strip()
                  )
                  forbidden_suffixes = tuple(
                      str(suffix).strip().lower()
                      for suffix in (scenario.get("forbidden_suffixes", ()) or ())
                      if str(suffix).strip()
                  )
                  required_sidecar_suffixes = tuple(
                      str(suffix).strip().lower()
                      for suffix in (scenario.get("required_sidecar_suffixes", ()) or ())
                      if str(suffix).strip()
                  )
                  smoke_out = smoke_root / f"out_loop{loop_index}_{scenario_name}"
                  smoke_out.mkdir(parents=True, exist_ok=True)
                  cmd = [binary, str(input_png), "--output-dir", str(smoke_out), *scenario_args]
                  completed = subprocess.run(cmd, capture_output=True, text=True)
                  if completed.returncode != 0:
                      raise SystemExit(completed.returncode)
                  produced_dds = sorted(smoke_out.glob("*.dds"))
                  if len(produced_dds) < min_outputs:
                      raise SystemExit(
                          f"Scenario '{scenario_name}' produced {len(produced_dds)} DDS file(s); expected at least {min_outputs}."
                      )
                  produced_names = [path.name.lower() for path in produced_dds]
                  for suffix in required_suffixes:
                      if not any(name.endswith(suffix) for name in produced_names):
                          raise SystemExit(
                              f"Scenario '{scenario_name}' missing required suffix '{suffix}'. Produced: {produced_names}"
                          )
                  for suffix in forbidden_suffixes:
                      if any(name.endswith(suffix) for name in produced_names):
                          raise SystemExit(
                              f"Scenario '{scenario_name}' produced forbidden suffix '{suffix}'. Produced: {produced_names}"
                          )
                  if required_sidecar_suffixes:
                      produced_all = [path.name.lower() for path in smoke_out.glob("*")]
                      for suffix in required_sidecar_suffixes:
                          if not any(name.endswith(suffix) for name in produced_all):
                              raise SystemExit(
                                  f"Scenario '{scenario_name}' missing required sidecar suffix '{suffix}'. Produced: {produced_all}"
                              )
          PY

      - name: Upload packaged smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-artifacts
          path: artifacts/packaged_smoke
          if-no-files-found: error

      - name: Create application zip
        run: |
          Copy-Item dist\generate_textures.exe generate_textures.exe
          Compress-Archive -Path generate_textures.exe, generate_textures.py, nif_patcher.py, README.md, requirements.txt, assets, fomod -DestinationPath skyrim-texture-generator.zip
        shell: pwsh

      - name: Create source zip
        run: |
          Compress-Archive -Path generate_textures.py, nif_patcher.py, README.md, requirements.txt, assets, tests -DestinationPath skyrim-texture-generator-source.zip
        shell: pwsh

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyrim-texture-generator
          path: skyrim-texture-generator.zip
          if-no-files-found: error

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyrim-texture-generator-source
          path: skyrim-texture-generator-source.zip
          if-no-files-found: error
